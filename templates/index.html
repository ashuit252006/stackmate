<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackMate AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            padding: 22px 28px;
            background: #111827;
            color: white;
        }
        header h1 { margin: 0 0 5px; font-size: 26px; }
        header p { margin: 0; color: #cbd5e1; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }
        .msg {
            margin: 12px 0;
            padding: 13px 16px;
            border-radius: 14px;
            max-width: 80%;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .bot {
            background: #f1f5f9;
            color: #0f172a;
            margin-right: auto;
        }
        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }
        .welcome {
            text-align: center;
            color: #64748b;
            margin: 35px 0;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #e5e7eb;
        }
        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }
        button {
            border: 0;
            padding: 0 22px;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: .9; }
        @media(max-width:600px) {
            .app { height: 95vh; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>🤖 StackMate AI</h1>
        <p>Your Full Stack Web Development Assistant</p>
    </header>

    <div id="chat">
        <div class="welcome">
            <h2>Build. Debug. Deploy. 🚀</h2>
            <p>Ask me about HTML, CSS, JavaScript, React, Flask, APIs, databases, Git, or deployment.</p>
        </div>
    </div>

    <div class="input-area">
        <input id="message" type="text" placeholder="Ask a web development question..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    input.addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        input.disabled = true;

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message})
            });
            const data = await res.json();
            addMessage(data.reply || "No response received.", "bot");
        } catch (error) {
            addMessage("Unable to connect to the server.", "bot");
        } finally {
            input.disabled = false;
            input.focus();
        }
    }
</script>
</body>
</html>
